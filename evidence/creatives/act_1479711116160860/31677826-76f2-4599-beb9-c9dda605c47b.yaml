prompt:
  text: "Create an operator-grade Japanese ad creative key visual for スマコンプロジェクト. Square feed composition, dark navy-to-charcoal background with crisp white and electric blue accents. Center: a clean strategic flow diagram showing two parallel lanes labeled “ASC” and “Advantage+” converging into “ROAS / CPO”. Add a secondary lower flow: “動画視聴 50%・100%” → “類似 1% / 3% / 5%”. Visual style should feel like a high-trust advertising operations command board, not a generic software dashboard: bold geometric panels, precise arrows, subtle data grid, premium consulting tone. Include prominent Japanese headline text: “ROAS/CPOで広告を再設計”. Small supporting text: “認知データを蓄積し、CV獲得へつなげる”. No logos, no platform icons, no brand marks."
  negativePrompt: "trademarked logos, Meta logo, Facebook logo, Instagram logo, app icons, generic storefront, lifestyle model, SaaS dashboard screenshot, fake UI with real platform branding, coupon, discount, easy money, overly playful design, cluttered text, low-resolution typography, distorted Japanese characters"
  styleNotes: "Square feed variant focused on strategy clarity and message match. Use restrained executive typography, high contrast first-frame readability, and avoid bargain/easy phrasing to attract self-investment-oriented prospects."
  rationale: "直近は配信・クリック・CVが0のため成果改善よりも配信再開後の認知データ蓄積とCV接続を優先し、knowledgeBriefsの『認知はAD_RECALL_LIFT/THRUPLAY、100%完全視聴率2%以上、動画視聴者から類似1%/3%/5%へ』という方針に合わせたフック型クリエイティブにしました。ブランド情報が限定的なため、スマコンプロジェクトのROAS/CPO再設計訴求を軸に、operator-gradeで高信頼・高コントラストな構成に絞っています。"
