  text: "Create an operator-grade first-frame ad visual for スマコンプロジェクト, aimed at serious adults with high self-investment intent. Square composition. Scene: a focused Japanese professional in their 30s-40s at a clean desk, reviewing a simple handwritten action map with three clear sections: current situation, decision points, next action. The person looks determined, not casual; subtle cinematic lighting, high contrast opening-frame impact, premium consulting / practical guidance atmosphere. Include visual motifs of整理 and行動: aligned sticky notes, a pen marking the next step, a small checklist, no visible brand logos. Leave a clean upper-left text-safe area for headline overlay. Color direction: deep navy, charcoal, white, subtle warm accent. Serious, trustworthy, no hype, no luxury-flex imagery."
