prompt:
  text: "Operator-grade Japanese B2B ad creative for an advertising operations consulting service. Square composition, clean dark navy and charcoal background with high-contrast white typography and subtle electric blue / green accents. Central visual: a strategic command-board style layout showing generic ad account metrics as abstract panels, with CPO and ROAS highlighted as the largest decision indicators, and smaller supporting indicators CPA, CVR, CTR faded into the background. Include a simple funnel flow from ad spend to lead to seminar application to backend sales, rendered as minimalist lines and nodes. No platform logos, no recognizable UI, no screenshots. Add prominent Japanese headline text:「CPO/ROASで広告運用を再設計」and smaller support text:「キャンペーン単体CPAではなく、アカウント全体で判断」. Premium consulting tone, precise, analytical, credible, designed for business owners and marketing managers."
  negativePrompt: "trademarked logos, Meta logo, Facebook logo, Instagram logo, exact platform UI, real dashboard screenshot, generic storefront, smiling lifestyle stock photo, coupons, easy money imagery, flashy get-rich-quick design, cluttered layout, low contrast, unreadable tiny text, childish icons, exaggerated claims, before-after body/health imagery"
  styleNotes: "Conversion-oriented feed square. Emphasize CPO/ROAS as the decision hierarchy, using operator-grade contrast and minimal Japanese copy. Keep all UI generic and logo-free."
  rationale: "配信実績が0のため勝ち負けの学習ではなく、知識ブリーフの『コンバージョン広告の判断基準』に沿ってCPO/ROAS・バックエンド売上を上位指標に据えた再設計訴求へ寄せました。ASCとAdvantage+の並行運用、既存顧客除外、認知動画の完全視聴率重視という方針を、ロゴなしの汎用的な広告運用ビジュアルで表現しています。"
