prompt:
  text: "Create a clean Japanese B2B ad key visual for 池田FB広告運用代行, operator-grade consulting tone. Square 1:1 composition. Main concept: Meta広告 for 講座・無形商材 should separate awareness and conversion. High-contrast first-frame style with a dark navy background, off-white panels, cyan accent lines, and subtle amber highlights. Center visual: a two-stage funnel diagram from left to right: 「認知動画」→「50% / 100% 視聴者データ」→「ASC + Advantage+」→「CV」. Large readable headline text: 「認知とCVを分ける広告設計」. Subtext in smaller Japanese: 「完全視聴率で見極め、後段で獲得へ」. Add minimal abstract icons: play button, audience clusters, funnel arrow, conversion checkpoint. No platform UI screenshots, no trademarked logos, no people posing, no generic storefront. Premium, analytical, trustworthy, designed like an expert advertising strategy slide."
  negativePrompt: "trademarked logos, Meta logo, Facebook logo, Instagram logo, platform UI screenshot, fake dashboard UI, generic SaaS dashboard, storefront, coupon design, cheap flashy sale banner, exaggerated income claims, stock photo handshake, smiling lifestyle model, cluttered text, unreadable tiny typography, low contrast, garish colors, medical or financial guarantees"
  styleNotes: "Feed square awareness-video first-frame concept; emphasizes the knowledgeBrief rule of separating awareness evaluation from CV evaluation and using complete-view data before conversion delivery."
  rationale: "配信実績が0で勝敗判断できないため、knowledgeBriefsの方針どおりCPAではなくThruPlay・100%完全視聴率を伸ばす認知動画の冒頭フックと、後段CV配信へ接続する二段階設計を可視化しました。配置情報が不明なため、dimensionPresetsからフィード正方形・縦長フィード・Story/Reelsをカバーし、講座/無形商材向けの専門的でoperator-gradeな図解トーンに統一しています。"
