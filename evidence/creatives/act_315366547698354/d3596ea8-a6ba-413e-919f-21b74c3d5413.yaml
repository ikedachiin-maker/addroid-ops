  text: "Create a 9:16 story/reels first-frame visual for a Japanese ad operations agency, 池田FB広告運用代行. Designed for an awareness video hook, not a conversion hard-sell. Strong thumb-stopping opening: large centered Japanese text 「CV広告が“はじめまして”になっていませんか？」. Under it, show a simple three-step vertical motion-ready composition: top card 「認知動画」 with play icon, middle card 「視聴者データ 1,000件」 with audience dots expanding, bottom card 「類似1% / 3% / 5% → CV広告」 with upward arrow. Add small footer text: 「講座・無形商材の二段階広告設計」. Dark navy gradient background, crisp white typography, cyan path line connecting the cards, subtle amber highlight on “1,000件”. Minimal, premium, expert, analytical. Leave safe margins at top and bottom for story UI overlays. No logos or app UI."
  negativePrompt: "trademarked logos, Meta logo, Facebook logo, Instagram logo, social media app interface, reels UI elements, real dashboard screenshot, stock photo presenter, generic lifestyle scene, retail shop, discount coupon, flashy money imagery, unrealistic guarantees, cluttered layout, low readability, excessive small text, childish cartoon style"
  styleNotes: "Story/Reels variant optimized as an awareness-video hook; aligns with knowledgeBrief guidance to build video-view audiences first and create lookalikes after 1,000 viewers."
  rationale: "配信実績が0で勝敗判断できないため、knowledgeBriefsの方針どおりCPAではなくThruPlay・100%完全視聴率を伸ばす認知動画の冒頭フックと、後段CV配信へ接続する二段階設計を可視化しました。配置情報が不明なため、dimensionPresetsからフィード正方形・縦長フィード・Story/Reelsをカバーし、講座/無形商材向けの専門的でoperator-gradeな図解トーンに統一しています。"
