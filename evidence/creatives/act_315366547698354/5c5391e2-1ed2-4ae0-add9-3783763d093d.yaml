prompt:
  text: "Create a vertical 4:5 Japanese B2B ad visual for 池田FB広告運用代行, aimed at business owners selling courses, seminars, coaching, and other intangible services. Layout: bold top hook area with large Japanese headline 「最初からCVだけ追わない」, followed by a structured vertical flow: 1「認知動画で視聴者を貯める」, 2「50% / 100% 視聴者を分析」, 3「類似1%・3%・5%へ拡張」, 4「ASCとAdvantage+でCV配信」. Use a refined operator-grade palette: deep navy, white, light gray, electric blue accents, small orange markers for decision points. Visual motif: an abstract campaign control board made of simple cards and arrows, but not a real ad platform UI. Include a strong visual separation line between 「認知KPI」 and 「CV KPI」 with labels 「ThruPlay / 完全視聴率」 and 「ROAS / CPO / CPA」. Sharp, professional, consultant-like, Japanese typography, plenty of whitespace."
  negativePrompt: "trademarked logos, brand marks, Meta logo, Facebook logo, Instagram logo, real ad manager interface, fake browser dashboard, unrelated ecommerce product, generic office team photo, storefront, cityscape, coupon, discount badge, get-rich-quick claim, overly playful illustration, messy infographic, tiny unreadable text, neon overload"
  styleNotes: "Feed portrait variant with stronger educational hierarchy; uses performance context of no delivery data by proposing a clear testable first creative based on the two-stage strategy and KPI separation."
  rationale: "配信実績が0で勝敗判断できないため、knowledgeBriefsの方針どおりCPAではなくThruPlay・100%完全視聴率を伸ばす認知動画の冒頭フックと、後段CV配信へ接続する二段階設計を可視化しました。配置情報が不明なため、dimensionPresetsからフィード正方形・縦長フィード・Story/Reelsをカバーし、講座/無形商材向けの専門的でoperator-gradeな図解トーンに統一しています。"
