  text: "Create a vertical portrait feed visual for a premium online/offline explanation session called “アイボリーサロン説明会,” with no logos and no embedded text. Composition: a poised adult learner seen from behind or three-quarter angle at a refined table, reviewing neatly arranged learning materials and a simple flow diagram on paper, with soft ivory light entering from the side. Visual metaphor: a clear path from “learning” to “outcome” shown through layered paper, steps, or a subtle line leading upward. Use ivory, champagne beige, muted charcoal accents, and spacious margins. Keep the subject grounded in a seminar/explanation-session context, sophisticated and sincere, not a generic office dashboard or lifestyle scene."
