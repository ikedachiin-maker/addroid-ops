version: 1
# AdDroid OSS — コンバージョン広告運用プレイブック (池田式)。
#
# 正本の解説は knowledge/conversion-ads-playbook.md。
# ここの数値閾値と briefs は improvement_pr (週次AI改善提案) の
# 8 agent パイプラインに knowledgeBriefs として注入され、
# judgment の値は workflows/automation-rules.yaml の CV 判定ルールと整合させる。

kpi:
  # セミナー/説明会 申し込み率 (獲得リスト比) の最低ライン
  seminarApplicationRateMin: 0.05
  # オプトインLPの登録率 (アクセス比) の合格ライン
  lpRegistrationRateMin: 0.20
  # セミナー成約率の最低ライン
  seminarClosingRateMin: 0.20
  # 個別相談 成約率の最低ライン
  consultClosingRateMin: 0.40
  # ROAS 合格ライン (限界CPA の基準) = 300%
  roasMin: 3.0
  # リンククリック CTR の下限 (これ未満は「ダメな広告」)
  ctrFloor: 0.01
  # CV 広告のフリークエンシー目安
  frequencyGuide: 2

judgment:
  # このリーチ数に達して CV=0 なら見切る (最初の判断基準)
  noCvReachCutoff: 1000
  # このリーチ数に達して CTR が ctrFloor 未満なら「ダメな広告」
  lowCtrReachCutoff: 1000

# improvement_pr の AI agent へそのまま注入する運用ルール (1 要素 = 1 ルール)
briefs:
  - "CV広告で見る指標は CV数・CPA・CVR・バックエンド誘導率・CPO。認知広告に CTR や CPA の改善を求めない (認知は完全視聴率と配信面だけ)。広告種別で見る指標を厳密に分ける。"
  - "CPO = 広告費 ÷ 販売本数を必ず算出する。ROAS 合格ラインは 300%。ROAS が良ければ CPA が高くても OK (例: CPA 1万円でもセミナー申し込み率 10% なら合格)。逆に CPA 500円で大量リストが入ってもセミナー申し込みゼロなら典型的なダメ広告として停止提案する。"
  - "広告の訴求と LP の内容を一致させる (メッセージマッチ)。LP 登録率がアクセス比 20% を下回る、またはセミナー申し込み率がリスト比 5% を下回る場合は、まず広告訴求と LP の整合性ズレを疑う改善提案を出す。数値悪化時は冒頭訴求とオファーの一貫性もチェックする。"
  - "訴求ワードで集まる客の質が決まる。自己投資欲のある人が反応する『お宝キーワード』を使い、『簡単・手軽・クーポン』訴求は行動しない客を集めるため避ける。"
  - "配信面を確認し、オーディエンスネットワークへの配信が 20% を超えていたら危険。配置チェックを外すと ASC が解除されるため、バリュールールで入札 -90% に減額して抑制する提案を出す。"
  - "ASC と Advantage+オーディエンス配信 (A+A) は必ず両方配信する (A+A は ASC のデータを使うため相乗効果)。予算比率は案件ごとにテストし、キャンペーン単位ではなく広告アカウント単位の CPA で判断する。片方の CPA が高いだけでキャンペーンを切らない。"
  - "既存顧客 (メルマガリスト等) はカスタムオーディエンス化し『既存顧客』に設定 + 予算上限 0% で配信除外する。"
  - "広告費は売上目標から逆算する (例: 売上1,000万 = 単価50万×20件 ← セミナー成約率20%で100人 ← 申し込み率5%で2,000リスト ← CPA 2,000円 = 広告費400万円)。講座など役務提供の単価は30万円以上を推奨。"
  - "CV 用動画は認知用動画とは別物として作る。構成: 最強実績のアイキャッチ→本編→お客様の声(2名分・①利用前の悩み②具体的数字の成果③決め手④未利用者へのメッセージ)→ノウハウ(結論先行)→オファー。"
  - "認知広告は日予算500円でいいので常に出稿しておく (CV広告が『はじめまして』にならないため)。"
  - "オファーは早く。ステップ配信終了直後に即オファーする (1〜2ヶ月後では忘れられている)。動画埋め込み型LP (5分視聴で登録フォーム出現) は CPA は高いが申込率・成約率が段違いに高く、登録特典も不要。"
  - "運用は朝一ルーティン (CPA/CTR/CV数の毎朝チェック) と事前に決めた運用基準 (限界CPA・リーチ数とCTR・説明会申し込み率) に従う。"
