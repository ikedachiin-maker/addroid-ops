# AdDroid OSS — automation rules.
#
# 自然言語リクエストはこの構造化 DSL に変換してから保存・実行する。
# LLM は DSL 生成まで、実行時の判定は deterministic rule engine が行う。

version: 1

rules:
  # 成績不振広告の停止「提案」(毎時評価・実行は人間承認)
  # 過去7日で spend >= 10,000円 かつ CV=0 の ACTIVE 広告を PAUSED 提案する。
  - id: pause-no-cv-ads
    enabled: true
    schedule: "0 * * * *"
    scope:
      level: ad
      includePaused: false
    window:
      preset: last_7d
      timezone: account
    metrics:
      spend:
        field: spend
        unit: currency
      conversions:
        field: conversions
        unit: count
    when:
      all:
        - metric: spend
          gte: 10000
        - metric: conversions
          eq: 0
    action:
      type: set_status
      status: PAUSED
    safety:
      mode: proposal
      minSpend: 10000
      cooldownHours: 24
