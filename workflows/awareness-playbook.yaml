version: 1
# AdDroid OSS — 認知広告運用プレイブック (池田式)。
#
# 正本の解説は knowledge/awareness-ads-playbook.md。
# ここの数値閾値と briefs は improvement_pr (週次AI改善提案) の
# 8 agent パイプラインに knowledgeBriefs として注入され、
# optimizationGoals は workflows/guards.yaml の認知広告ガードと整合させる。

kpi:
  # 動画100%完全視聴率 (video_p100 ÷ 動画再生数) の合格ライン
  videoCompletionRateMin: 0.02
  # CTR の参考合格ライン
  ctrReferenceIntangible: 0.01
  ctrReferenceStore: 0.02

optimizationGoals:
  allowed: [AD_RECALL_LIFT, THRUPLAY]
  forbidden: [REACH, IMPRESSIONS]

testing:
  # 1 クリエイティブあたりのテスト日予算 (JPY)
  dailyBudgetPerCreative: 1000
  # 冒頭 (フック) テストの目安日数
  minTestDays: 2
  # 1 バッチの変異体数の目安
  batchSize: 5

audience:
  # 類似オーディエンス化に必要な動画視聴者リストの分母目標
  videoViewersSeedTarget: 1000
  lookalikePercents: [1, 3, 5]

# improvement_pr の AI agent へそのまま注入する運用ルール (1 要素 = 1 ルール)
briefs:
  - "認知広告の目的は2つ。①『何かが始まる』と知ってもらう想起形成、②動画視聴者データを貯めて類似オーディエンスの元を作ること。認知段階では登録・CV・CPA を目的や判定に使わない。"
  - "認知キャンペーンの最適化目標は広告想起リフト最大化(AD_RECALL_LIFT)と ThruPlay(THRUPLAY)のみ。リーチ最大化(REACH)・インプレッション最大化(IMPRESSIONS)は使わない。Meta の UI はデフォルトでリーチ最大化が選ばれるので特に注意。想起リフトと ThruPlay は並行テストし、完全視聴率が高い方を残す。"
  - "認知クリエイティブの合格ラインは動画100%完全視聴率 2% 以上。下回るクリエイティブは冒頭(フック)差し替えの改善を提案する。冒頭を変えるだけで視聴率は大きく変わる。"
  - "認知広告はフリークエンシーが 2 を大きく超えても問題ない(高頻度OK)。フリークエンシー約2の目安はコンバージョン広告のみに適用する。"
  - "認知テストは 1 本あたり日 1,000 円程度の小予算 × 2〜3 日で冒頭違いを比較し、完全視聴率が最も高い 1 本へ予算を寄せる提案をする。"
  - "動画視聴者カスタムオーディエンス(まず50%視聴、予算があれば100%視聴)が 1,000 件貯まったら、類似オーディエンス 1% / 3% / 5% の作成とコンバージョン広告の投入を提案する(ROAS 1000% 超の実績がある王道パターン)。"
  - "最適化目標に ThruPlay を選ぶ場合、課金対象を ThruPlay 課金(15秒以上視聴のみ課金)にできるか確認する。アカウント実績が貯まると選択可能になり、完全視聴率がインプレッション課金の約2倍になる。"
  - "認知広告は施策開始の 2 週間〜3 ヶ月前から出稿し、開始後も『開催中』訴求に切り替えて出し続ける。開始直前・直後だけの出稿は非推奨。"
  - "CPM は安さだけで評価しない(高CPM=質の高い配信先の可能性)。認知の CPM 相場はコンバージョン広告の 1/5 程度。CTR 参考合格ライン: 無形商材 1% / 店舗 2%。ROAS の合格ラインは 300%。"
  - "認知用動画とコンバージョン用動画は別物として提案する。認知動画のメインテキストには『動画を最後まで見ると特典がもらえる』要素を入れて視聴維持率を上げる。無形商材の構成: インパクトメッセージ→本編→お客様の声→ノウハウ→オファー(ストーリー調)。店舗の構成: 既視感(有名な駅・施設からの道順)+疑似体験→オファー。"
  - "想起リフト用と ThruPlay 用は同一クリエイティブでもファイル名を変えて別アップロードし、最適化目標別に視聴者オーディエンスを分離する(後段のコンバージョン広告でどちら由来の類似が安いか比較するため)。"
