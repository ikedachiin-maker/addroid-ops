awareness:
  purpose: 想起形成と、後続の類似オーディエンス用の動画視聴者データ収集
  budget_method: lifetime_budget
  budget_reason: 総額3000円を守るため各系統1500円の期間予算。日別消化は変動し、毎日きっちり1000円ではない。
  arms:
    - campaign_key: cmp_gekifudosan_awareness_recall_20261011
      adset_key: ads_gekifudosan_awareness_recall_20261011
      objective: OUTCOME_AWARENESS
      optimization_goal: AD_RECALL_LIFT
      billing_event: IMPRESSIONS
      lifetime_budget: 1500
      daily_equivalent: 500
    - campaign_key: cmp_gekifudosan_awareness_thruplay_20261011
      adset_key: ads_gekifudosan_awareness_thruplay_20261011
      objective: OUTCOME_AWARENESS
      optimization_goal: THRUPLAY
      billing_event: IMPRESSIONS
      lifetime_budget: 1500
      daily_equivalent: 500
  thruplay_billing:
    availability: not_verified
    current_draft: IMPRESSIONS
    next_step: 対象アカウントでThruPlay課金を選べるか確認し、利用可能なら課金条件変更をレビューに含める。最適化目標THRUPLAYとは別設定。
  comparison:
    initial_creatives_per_arm: 1
    same_video_content_across_arms: true
    separate_uploads_and_video_ids: true
    identical_audience_placement_and_dates: true
    primary_metric: video_p100_watched / video_plays
    completion_rate_min: 0.02
    secondary_metric: spend / video_p100_watched
    division_by_zero: 判定保留
    no_cv_pause: false
    no_frequency_only_pause: true
    insufficient_data: 3日後にデータ不足なら勝者を断定しない。延長・増額は別途決定する。
    future_hook_test: 次のテストは冒頭違いを候補にする。今回の3000円内に多数の動画テストを同時追加しない。
  after_test: 10月15日00時に期間終了。勝者への継続配信は別の予算・承認で決定し、自動延長しない。

conversion:
  total_daily_budget: 2000
  initial_split: "50:50"
  arms:
    - campaign_key: cmp_gekifudosan_registration_advplus_20261011
      adset_key: ads_gekifudosan_registration_advplus_20261011
      name: 現行Advantage+リード
      objective: OUTCOME_LEADS
      budget_level: campaign
      daily_budget: 1000
      advantage_audience: 1
      placements: automatic
      expected_advantage_state: ADVANTAGE_PLUS_LEADS
    - campaign_key: cmp_gekifudosan_registration_aa_20261011
      adset_key: ads_gekifudosan_registration_aa_20261011
      name: A+A・広告セット予算
      objective: OUTCOME_LEADS
      budget_level: adset
      daily_budget: 1000
      advantage_audience: 1
      placements: automatic
  hierarchy_per_arm:
    campaigns: 1
    adsets: 1
    planned_ads: 1
    ads_created_by_this_pr: 0
  tracking:
    pixel_id: "1593465604724678"
    dataset_name: まるなげ出張買取体験会0121
    destination_type: WEBSITE
    optimization_goal: OFFSITE_CONVERSIONS
    event: COMPLETE_REGISTRATION
    scope: 今回のUTAGEメール登録完了。LINE追加・説明会申込・購入はこのイベントに含めない。
    landing_url: https://sub.ad-marketing.xyz/p/LLwd5i17rMW0
    completion_url: https://sub.ad-marketing.xyz/page/aCrKQXVeeh5Z
    attribution: クリック7日・表示1日
    ad_level_tracking: 広告作成時に両系統とも同じピクセルを指定し、UTMまたはUTAGE登録経路で系統を区別する。
    shared_pixel_caution: 既存案件と共用のデータセットなので、レポートでは今回のキャンペーンとUTAGE登録経路で絞り込む。
  current_meta_adaptation:
    legacy_asc_creation_supported: false
    reason: Meta公式の現行APIは旧ASC作成フラグを廃止。今回の成果は購入ではなく登録のためOUTCOME_LEADSを維持し、予算・オーディエンス・配置を自動化するAdvantage+リードへ対応づける。
    limits: 旧ASCとA+Aの完全再現ではない。現行の両系統は共通のAdvantage+基盤で、1広告セット構成では予算階層の差も小さい。独立アルゴリズムや旧資料の学習相乗効果を保証しない。
    verification_after_apply: advantage_state_infoを読み取り、Advantage+リード側の予算・オーディエンス・配置がENABLEDであることを確認する。
    source: https://developers.facebook.com/documentation/ads-commerce/marketing-api/advantage-campaigns
  judging:
    priority: [売上とCPOとROAS, 説明会申込率, 登録率とCPA, CTRとCPC, CPM]
    combined_cpa: 今回のCV2系統の合算CPAを比較し、アカウント全体も確認する。他案件の成果を今回の成果に混ぜない。
    final_roas_cost_basis: 今回の認知費用も含めた総広告費で売上効率を評価する。
    no_cv_reach_cutoff: 1000
    low_link_ctr_reach_cutoff: 1000
    low_link_ctr_floor: 0.01
    lp_registration_rate_min: 0.20
    seminar_application_rate_min: 0.05
    seminar_closing_rate_min: 0.20
    consult_closing_rate_min: 0.40
    roas_min: 3.0
    frequency_guide: 2
    stop_mode: proposal_only
    attribution_delay_and_pixel_health: 停止提案前に計測不具合と成果反映遅延を確認する。
  placement_review:
    audience_network_share_threshold: 0.20
    action: 実績と流入の質を確認し、利用可能ならバリュールールによる抑制を提案する。初回作成で一律除外はしない。

creative_and_audience_followup:
  separate_awareness_and_conversion_videos: true
  awareness_video: インパクトのある冒頭・本編・お客様の声・ノウハウ・オファー。最適化目標ごとに別アップロード。
  conversion_video: 強い実績・本編・具体的な成果を含むお客様の声・ノウハウ・一貫したオファー。
  ad_to_lp_message_match: true
  testimonials: [利用前の悩み, 具体的な数字の成果, 選んだ決め手, 検討者へのメッセージ]
  seed_percent_viewed: 50
  seed_target: 1000
  future_lookalike_percents: [1, 3, 5]
  audience_creation: 動画IDと視聴者蓄積が揃った後、作成を提案する。現時点では未作成。
  existing_customer_exclusion: 既存顧客カスタムオーディエンスIDを確認後、現行仕様の除外を追加する。旧existing_customer_budget_percentageは使用しない。

activation_readiness:
  ready: false
  pending:
    - 広告素材、発信元FacebookページとInstagram、広告4件の確定・作成
    - 認知動画の目標別アップロードとThruPlay課金可否の確認
    - 既存顧客除外の対象、広告単位のトラッキングと登録経路の確認
    - 対象アカウントの実API互換性・最低予算・ピクセル利用権限・審査状態の確認
    - 反映後の期間予算、開始終了日時、Advantage+状態を確認
    - 10月12日00時を過ぎた場合は過去開始日時のまま有効化せず、期間と予算を再確認
    - 人間による変更案の承認と、監査対象の配信開始操作
  this_pr_effect: キャンペーン4件と広告セット4件をPAUSEDで作る準備。日時が到来しても自動でACTIVEにならない。

